[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-document-assistant"
version = "0.1.0"
description = "Chat with your documents using RAG"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-huggingface>=0.1",
    "langchain-chroma>=0.1",
    "chromadb>=0.5",
    "sentence-transformers>=2.7",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "unstructured>=0.14",
    "markdown>=3.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "streamlit>=1.34",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "black>=24.0", "pytest-cov>=5.0"]
eval = ["ragas>=0.1", "datasets>=2.19"]
openai = ["langchain-openai>=0.1"]
ollama = ["langchain-ollama>=0.1"]
gemini = ["langchain-google-genai>=2.0"]
groq = ["langchain-groq>=0.2"]
all-providers = [
    "langchain-openai>=0.1",
    "langchain-ollama>=0.1",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.2",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
