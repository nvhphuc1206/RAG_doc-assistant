services:
  app:
    build: .
    container_name: rag-app
    ports:
      - "8501:8501"
    env_file: .env
    volumes:
      - chroma_data:/app/.chroma
      - ./data:/app/data
    restart: unless-stopped

  api:
    build: .
    container_name: rag-api
    command: ["uvicorn", "src.api.routes:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - chroma_data:/app/.chroma
      - ./data:/app/data
    restart: unless-stopped

volumes:
  chroma_data:
